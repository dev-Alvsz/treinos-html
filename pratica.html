<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Estação Meterológica</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="alerta-urgente">AVISO: Frente fria se aproxima!</div>
    <main class="painel-clima">
        <div class="card temp"><h3>24ºC</h3><p>Temperatura</p></div>
        <div class="card vento"><h3>18km/h</h3><p>Vento</p></div>
        <div class="card umidade"><h3>65%</h3><p>Umidade</p></div>

        <div class="limpar-fluxo"></div>
        <p class="noa-rodape">Dados atualizados em tempo real.</p>
    </main>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f0f4f8;
            height: 1800px;
        }
        .alerta-urgente {
            position: sticky;
            top: 0;
            z-index: 20;
            background-color: #ff3838;
            color: #ffffff;
            padding: 15px;
            text-align: center;
            font-weight: bold;
        }
        .painel-clima {
            width: 600px;
            margin: 50px auto;
            padding: 30px;
            background-color: #ffffff;
            border: 2px solid #ccc;
            position: relative;
        }
        .card {
            width: 140px;
            height: 120px;
            padding: 20px;
            margin: 10px 6px;
            color: #ffffff;
            float: left;
            border-radius: 6px;
        }
        .temp {
            background-color: #ff9f43;
        }
        .vento {
            background-color: #0abde3;
        }
        .umidade {
            background-color: #10ac84;
        }

        .limpar-fluxo {
            clear: both;
        }
        .nota-rodape {
            text-align: absolute;
            bottom:  10px;
            right: 15px;
            font-size: 11px;
            color: #555;
        }
