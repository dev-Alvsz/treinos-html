<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <title>PixelShop - Checkout Seguro</title>
        <link rel="stylesheet" href="css/style.css">
    </head>
    <body>
        <div class="checkout-container">
            <header class="cabecalho-loja">
                <h1>Carrinho de Compras</h1>
                <div class="seguranca">Conexão Segura <span class="selo-seguro"></span></div>
            </header>
            <main class="grade-pagamentos">
                <div class="metodo-card" style="animation-delay: 0.2s;">
                    <h3>Cartão de Crédito</h3>
                    <div class="icone-check">
                </div>

                <div class="metodo-card" style="animation-delay: 0.04s;">
                    <h3>Pagamento via PIX</h3>
                    <div class="texto-desconto">5% OFF</div>
                    </div>

                    <div class="metodo-card" style="animation-delay: 0.06s;">
                        <h3>Progresso do Pedido</h3>
                        <div class="barra-progresso">
                            <div class="linha-carregamento"></div>
                        </div>
                    </div>
                </main>

                <button class="btn-finalizar">Finalizar Compra</button>
            </div>
        </div>

        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body {
                background-color: #0b0c10;
                font-family: 'Segoe UI', sans-serif;
                display: flex;
                justify-content: center;
                align-items: center;
                height: 100vh;
            }

            .checkout-container {
               width: 90%;
               max-width: 650px;
               background-color: #1f2833;
               padding: 35px;
               border-radius: 16px;
               border-radius: 0 15px 35px rgba(0, 0, 0, 0.6);
               color: #ffffff;
            }
            .cabecalho-loja {
                display: flex;
                justify-content: space-between;
                align-items: center;
                margin-bottom: 30px;
                border-bottom: 1px solid #45f3ff;
                padding-bottom: 15px;
            }

            .seguranca {
                font-size: 0.85rem;
                color: #c5a059;
                display: flex;
                align-items: center;
            }

            .selo-seguro {
                display: inline-block;
                width: 10px;
                height: 10px;
                border-radius: 50%;
                margin-left: 8px;
                animation: pulsa-seguranca 1.5s infinite;
            }

            @keyframes pulsa-seguranca {
                0%, 100% { background-color: #45f3ff;
                box-shadow: 0 0 0px #45f3ff;
                }
                50% { background-color: #45f3ff;
                box-shadow: 0 0 14px #45f3ff;
                }
            }
            .grid-pagamentos {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
                gap: 20px;
                margin-bottom: 30px;
            }

            @keyframes surgirCard {
                from {
                    transform: scale(0.8) translateY(30px);
                    opacity: 0;
                }
                to {
                    transform: scale(1) translateY(0);
                    opacity: 1;
                }
            }
            .metodo-card {
                background-color: #151a21;
                border: 1px solid #2d3545;
                padding: 25px;
                border-radius: 12px;
                animation: surgirCard 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) backwards;
                transition: transform 0.3s, border-color 0.3s, background-color 0.3s;
            }

            .metodo-card h3 {
                font-size: 0.95rem;
                margin-bottom: 15px;
                color: #c5a059;
            }

            .texto-desconto {
                font-size: 1.4rem;
                margin-bottom: 15px;
                color: #c5a059;
            }

            .texto-desconto {
                font-size: 1.4rem;
                font-weight: bold;
                color: #45f3ff;
            }

            .metodo-card:hover {
                transform: translateY(-5px);
                border-color: #45f3ff;
                background-color: #1b222c;
            }
            .icone-check {
                width: 22px;
                height: 22px;
                border: 2px solid #555555;
                border-radius: 50%;
                transition: border-color 0.3s, background-color 0.3s;
            }

            .metodo-card:hover .icone-check {
                background-color: #45f3ff;
                border-color: #45f3ff;
            }
            .barra-progresso {
                height: 8px;
                background-color: #2d3545;
                border-radius: 4px;
                overflow: hidden;
            }

            .linha-carregamento {
                height: 100%;
                background-color: #45f3ff;
                width: 0;
                animation: avancolinha 2.5s ease-out forwards;
            }

            @keyframes avancolinha {
                to {width: 66%;}
            }

            .btn-finalizar {
                display: block;
                width: 100%;
                background-color: #c5a059;
                color: #0b0c10;
                border: none;
                padding: 15px;
                font-size: 1rem;
                cursor: pointer;
                animation: pulsarBotao 2s infinite;
            }

            @keyframes pulsarBotao {
                0%, 100% { box-shadow: 0 0 0px rgba(197, 160, 89, 0); }
                50% { box-shadow: 0 0 20px rgba(197, 160, 89, 0.6); }
            }


            
        </style>
    </body>
</html>
