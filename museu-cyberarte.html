<!DOCTYPE html>
<html lang="pt-BR">
<head>

            <style>
                * {
                    margin: 0;
                    padding: 0;
                    box-sizing: border-box;
                }

                body {
                    font-family: Arial, sans-serif;
                    background-color: #f0f4f8;
                    height: 1800px;
                }

            
                .vitrine-obras {
                    width: 600px;

                    padding: 40px;

                    position: relative;
                }

                .quadro-digital{
                    width: 48%;
                    float: left;
                    color: #ff0303;
                }


                .selo-exclusivo {
                    position: absolute;
                    top: 10px;
                    right: 10px;
                    background-color: #ff9f43;
                    color: #ffffff;
                    padding: 5px 10px;
                    font-weight: bold;
                    border-radius: 4px;
                    z-index: 5;
                }

</body>
